services:
  postgres:
    image: postgres:16
    container_name: postgres_indicateurs
    environment:
      POSTGRES_DB: indicateurs_eco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indicateurs_eco"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  airflow-db:
    image: postgres:16
    container_name: airflow_metadata_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD}"
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow_init

    depends_on:
      airflow-db:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"

      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Africa/Casablanca"

      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"


      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          --password "${AIRFLOW_ADMIN_PASSWORD}" || true

    restart: "no"


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow_scheduler
    hostname: airflow_scheduler

    depends_on:
      postgres:
        condition: service_healthy

      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"

      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Africa/Casablanca"

      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"

      PYTHONPATH: /opt/airflow

      # ========================================================
      # Connexion à la base indicateurs_eco
      # ========================================================

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: indicateurs_eco
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD}"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs

    command:
      - airflow
      - scheduler

    restart: unless-stopped


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow_webserver

    depends_on:
      postgres:
        condition: service_healthy

      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"

      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Africa/Casablanca"

      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"

      PYTHONPATH: /opt/airflow

      # ========================================================
      # Connexion à la base indicateurs_eco
      # ========================================================

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: indicateurs_eco
      DB_USER: postgres
      DB_PASSWORD: "${DB_PASSWORD}"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs

    ports:
      - "8081:8080"

    command:
      - airflow
      - webserver

    restart: unless-stopped


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  postgres_data:
    name: projet-indicateurs-eco_postgres_data

  airflow_db_data:
    name: projet-indicateurs-eco_airflow_db_data